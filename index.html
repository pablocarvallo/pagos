<style>
/* Concepto: la lista de pagos del mes, igual que la nota de Notas, pero con avance a la vista.
   Arriba el título del mes (se toca para cambiarlo) y la tarjeta con cuántos pagos van hechos;
   debajo las secciones con su lista de check. "Nuevo mes" desmarca todo y guarda el mes anterior. */
/*DS:TOKENS:START*/
/* ── Domésticas · sistema de diseño común (v1) ──────────────────────────────
   Paleta: #2950F4 · #4D78F3 · #719DF6 · #99C2F8 · #BDEBFB, con el azul marino #182D4A de fondo oscuro.
   Estilo iOS 27: tipografía del sistema (SF Pro), tarjetas blancas sobre fondo agrupado,
   barras y botones de vidrio, cápsulas, esquinas amplias. Igual en todas las apps de la casa. */
:root {
  --ds-b1: #2950F4; --ds-b2: #4D78F3; --ds-b3: #719DF6; --ds-b4: #99C2F8; --ds-b5: #BDEBFB; --ds-navy: #182D4A;
  --ds-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
  --ds-font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
  --ds-font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --ds-font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ds-r-card: 24px; --ds-r-inner: 16px; --ds-r-field: 14px; --ds-r-sheet: 34px; --ds-r-pill: 999px;

  --ds-bg: #EFF3FB;
  --ds-bg-top: #DFE9FD;
  --ds-surface: #FFFFFF;
  --ds-surface-2: #F3F6FD;
  --ds-fill: rgba(41, 80, 244, 0.07);
  --ds-fill-2: rgba(41, 80, 244, 0.13);
  --ds-ink: #0E1B33;
  --ds-ink-2: #55617A;
  --ds-ink-3: #8691A8;
  --ds-line: rgba(24, 45, 74, 0.12);
  --ds-line-2: rgba(24, 45, 74, 0.2);
  --ds-tint: #2950F4;
  --ds-tint-soft: #E5ECFE;
  --ds-btn: #2950F4;
  --ds-on-btn: #FFFFFF;
  --ds-pos: #157A43; --ds-pos-soft: #DDF4E6;
  --ds-neg: #D1281C; --ds-neg-soft: #FDE8E6;
  --ds-warn: #A35500; --ds-warn-soft: #FFF0D9;
  --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.45) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #4D78F3 0%, #2950F4 58%, #2141D6 100%);
  --ds-hero-ink: #FFFFFF;
  --ds-hero-ink-2: rgba(255, 255, 255, 0.84);
  --ds-hero-line: rgba(255, 255, 255, 0.28);
  --ds-hero-glass: rgba(255, 255, 255, 0.18);
  --ds-glass: rgba(255, 255, 255, 0.7);
  --ds-glass-strong: rgba(255, 255, 255, 0.86);
  --ds-glass-line: rgba(255, 255, 255, 0.85);
  --ds-glass-edge: rgba(14, 27, 51, 0.1);
  --ds-glass-blur: blur(22px) saturate(1.8);
  --ds-shadow-1: 0 1px 2px rgba(24, 45, 74, 0.05), 0 4px 14px rgba(24, 45, 74, 0.05);
  --ds-shadow-2: 0 12px 32px rgba(24, 45, 74, 0.16), 0 2px 8px rgba(24, 45, 74, 0.08);
  --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 6px 16px rgba(41, 80, 244, 0.26);
  --ds-scrim: rgba(14, 27, 51, 0.36);
  --ds-chart-1: #2950F4; --ds-chart-2: #719DF6; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ds-bg: #0A1224;
    --ds-bg-top: #13244A;
    --ds-surface: #152340;
    --ds-surface-2: #1C2C4D;
    --ds-fill: rgba(113, 157, 246, 0.12);
    --ds-fill-2: rgba(113, 157, 246, 0.2);
    --ds-ink: #EEF3FF;
    --ds-ink-2: #A9B6D0;
    --ds-ink-3: #77859F;
    --ds-line: rgba(189, 235, 251, 0.11);
    --ds-line-2: rgba(189, 235, 251, 0.2);
    --ds-tint: #8EB0FA;
    --ds-tint-soft: rgba(113, 157, 246, 0.18);
    --ds-btn: #3A62F5;
    --ds-on-btn: #FFFFFF;
    --ds-pos: #5DD68E; --ds-pos-soft: rgba(93, 214, 142, 0.14);
    --ds-neg: #FF8A80; --ds-neg-soft: rgba(255, 138, 128, 0.14);
    --ds-warn: #FFB65C; --ds-warn-soft: rgba(255, 182, 92, 0.14);
    --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.28) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #3D68F2 0%, #2950F4 55%, #1C38C2 100%);
    --ds-glass: rgba(24, 40, 70, 0.62);
    --ds-glass-strong: rgba(24, 40, 70, 0.84);
    --ds-glass-line: rgba(255, 255, 255, 0.14);
    --ds-glass-edge: rgba(0, 0, 0, 0.4);
    --ds-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
    --ds-shadow-2: 0 14px 36px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
    --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 6px 16px rgba(0, 0, 0, 0.35);
    --ds-scrim: rgba(0, 0, 0, 0.55);
    --ds-chart-1: #719DF6; --ds-chart-2: #4D78F3; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ds-bg: #0A1224;
  --ds-bg-top: #13244A;
  --ds-surface: #152340;
  --ds-surface-2: #1C2C4D;
  --ds-fill: rgba(113, 157, 246, 0.12);
  --ds-fill-2: rgba(113, 157, 246, 0.2);
  --ds-ink: #EEF3FF;
  --ds-ink-2: #A9B6D0;
  --ds-ink-3: #77859F;
  --ds-line: rgba(189, 235, 251, 0.11);
  --ds-line-2: rgba(189, 235, 251, 0.2);
  --ds-tint: #8EB0FA;
  --ds-tint-soft: rgba(113, 157, 246, 0.18);
  --ds-btn: #3A62F5;
  --ds-on-btn: #FFFFFF;
  --ds-pos: #5DD68E; --ds-pos-soft: rgba(93, 214, 142, 0.14);
  --ds-neg: #FF8A80; --ds-neg-soft: rgba(255, 138, 128, 0.14);
  --ds-warn: #FFB65C; --ds-warn-soft: rgba(255, 182, 92, 0.14);
  --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.28) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #3D68F2 0%, #2950F4 55%, #1C38C2 100%);
  --ds-glass: rgba(24, 40, 70, 0.62);
  --ds-glass-strong: rgba(24, 40, 70, 0.84);
  --ds-glass-line: rgba(255, 255, 255, 0.14);
  --ds-glass-edge: rgba(0, 0, 0, 0.4);
  --ds-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --ds-shadow-2: 0 14px 36px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
  --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 6px 16px rgba(0, 0, 0, 0.35);
  --ds-scrim: rgba(0, 0, 0, 0.55);
  --ds-chart-1: #719DF6; --ds-chart-2: #4D78F3; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
  color-scheme: dark;
}
html { background: var(--ds-bg); }
body {
  font-family: var(--ds-font);
  background: linear-gradient(180deg, var(--ds-bg-top) 0, var(--ds-bg) 340px) no-repeat, var(--ds-bg);
  color: var(--ds-ink);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.012em;
}
/*DS:TOKENS:END*/
/*DS:VARS:START*/

/* Variables propias de Pagos del mes */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --chk-ring: #C3CBDB; --chk-ink: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --chk-ring: #42537A; --chk-ink: #0A1224; }
}
:root[data-theme="dark"] { --chk-ring: #42537A; --chk-ink: #0A1224; }
/*DS:VARS:END*/

/*DS:BASE:START*/
/* ── Domésticas · elementos comunes (v1): fondo, tipografía, campos, icono de la app ── */
html { background: var(--ds-bg); }
body {
  font-family: var(--ds-font);
  background: linear-gradient(180deg, var(--ds-bg-top) 0, var(--ds-bg) 360px) no-repeat, var(--ds-bg);
  color: var(--ds-ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { font-family: var(--ds-font-display); letter-spacing: -0.022em; }
button, input, select, textarea { font-family: inherit; }
::selection { background: var(--ds-tint-soft); }
:focus-visible { outline-color: var(--ds-tint); }
input, select, textarea { accent-color: var(--ds-btn); caret-color: var(--ds-tint); }
@keyframes ds-rise { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
.mark.app-icon, img.app-icon { display: block; overflow: hidden; padding: 0; background: none; object-fit: cover; border-radius: 23%; box-shadow: 0 0 0 0.5px rgba(14, 27, 51, 0.08), 0 4px 12px rgba(41, 80, 244, 0.25); }
/*DS:BASE:END*/
/*DS:COMP:START*/
/* ── Domésticas · componentes comunes (v1) ── */
body { font-size: 17px; line-height: 1.38; }
.app { gap: 20px; padding-block: 14px 48px; }
.eyebrow { font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: -0.005em; color: var(--ds-ink-2); }
.muted { color: var(--ds-ink-2); }

/* Encabezado con título grande */
.top { gap: 12px; padding-top: 6px; }
.top h1 { font-size: 34px; line-height: 1.08; font-weight: 700; letter-spacing: -0.03em; }
.mark {
  width: 46px; height: 46px; border-radius: 13px; color: #fff; background: var(--ds-hero);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), inset 0 -1px 0 rgba(14, 27, 51, 0.18), 0 4px 12px rgba(41, 80, 244, 0.28);
}
.mark svg, .mark img { filter: drop-shadow(0 1px 1px rgba(14, 27, 51, 0.25)); }

/* Botones: cápsulas, relleno sólido o tintado */
.btn {
  min-height: 50px; border-radius: var(--ds-r-pill); border: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
  transition: transform 0.16s ease, opacity 0.16s ease, background-color 0.16s ease;
}
.btn:active { transform: scale(0.97); opacity: 0.88; }
.btn.primary { background: var(--ds-btn); color: var(--ds-on-btn); box-shadow: var(--ds-shadow-btn); }
.btn.tonal { background: var(--ds-tint-soft); color: var(--ds-tint); }
.btn.ghost { background: var(--ds-surface); color: var(--ds-tint); border: 0; box-shadow: var(--ds-shadow-1); }
.btn.plus { background: var(--ds-surface); color: var(--ds-pos); border: 0; box-shadow: var(--ds-shadow-1); }
.btn.danger { background: var(--ds-neg-soft); color: var(--ds-neg); border: 0; }
.btn.danger.armed { background: var(--ds-neg); color: #fff; }
.btn.small { min-height: 40px; padding: 0 16px; font-size: 15px; }
.btn.big { min-height: 58px; border-radius: 20px; font-size: 16px; line-height: 1.2; }
.linkbtn { color: var(--ds-tint); text-decoration: none; font-size: 15px; }

/* Tarjeta principal: degradado de la paleta con brillo de vidrio */
.hero {
  border-radius: 28px; padding: 20px 20px 18px; background: var(--ds-hero); color: var(--ds-hero-ink);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.38), inset 0 -1px 0 rgba(14, 27, 51, 0.16), 0 16px 34px rgba(41, 80, 244, 0.26);
}
.hero::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0) 38%); }
.hero-mark, .hero-art { opacity: 0.12; }
.hero .eyebrow, .hero-note { color: var(--ds-hero-ink-2); }
.hero-btn, .hero .chip, .hero button.ghost {
  background: var(--ds-hero-glass); border: 0.5px solid rgba(255, 255, 255, 0.45); color: #fff;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
}
.hero-cta { border-radius: var(--ds-r-pill); background: #fff; color: var(--ds-b1); font-weight: 700; padding: 0 20px; box-shadow: 0 6px 16px rgba(14, 27, 51, 0.2); }
.total { font-family: var(--ds-font-round); font-weight: 700; letter-spacing: -0.025em; }
.hero-stats { border-top-color: var(--ds-hero-line); }
.hero-stats dt { color: var(--ds-hero-ink-2); }

/* Encabezados de sección */
.sec-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.025em; }
.sync { color: var(--ds-ink-2); }

/* Listas agrupadas (estilo Ajustes de iOS) */
.list, .steps {
  gap: 0; background: var(--ds-surface); border-radius: var(--ds-r-card); overflow: hidden; box-shadow: var(--ds-shadow-1);
}
.row, .step {
  position: relative; border: 0; border-radius: 0; background: transparent; min-height: 60px; padding: 11px 16px 11px 14px;
}
.row:active, .step:active { background: var(--ds-fill); }
.row.old { background: transparent; opacity: 0.62; }
.list > li + li > .row::before, .steps > li + li > .step::before {
  content: ""; position: absolute; top: 0; right: 0; left: 64px; border-top: 0.5px solid var(--ds-line-2);
}
.ico { width: 38px; height: 38px; background: var(--ds-fill); color: var(--ds-ink-2); }
.ico.in { background: var(--ds-pos-soft); color: var(--ds-pos); }
.ico.auto { background: var(--ds-tint-soft); color: var(--ds-tint); }
.store { font-weight: 600; }
.meta, .run { color: var(--ds-ink-2); }
.amt { font-weight: 600; }
.amt.in { color: var(--ds-pos); }
.tag { background: var(--ds-tint-soft); color: var(--ds-tint); }
.step-n { background: var(--ds-tint-soft); color: var(--ds-tint); }
.step.done .step-n { background: var(--ds-pos-soft); color: var(--ds-pos); }
.step-t span { color: var(--ds-ink-2); }
.anchor { color: var(--ds-ink-3); padding: 8px 16px; }
.anchor::before, .anchor::after { border-top: 0.5px solid var(--ds-line-2); }
.empty { border: 0; border-radius: var(--ds-r-card); background: var(--ds-surface); box-shadow: var(--ds-shadow-1); color: var(--ds-ink-2); padding: 18px; }
.foot { color: var(--ds-ink-3); }

/* Filtros en cápsula */
.chip { border: 0; background: var(--ds-fill); color: var(--ds-ink); font-weight: 600; min-height: 36px; padding: 0 15px; }
.chip[aria-pressed="true"] { background: var(--ds-btn); color: #fff; }

/* Datos y respaldo */
.backup { border: 0; border-radius: var(--ds-r-card); background: var(--ds-surface); box-shadow: var(--ds-shadow-1); }
.backup textarea, .field textarea { border: 0; border-radius: var(--ds-r-field); background: var(--ds-surface-2); }

/* Hojas (sheets) */
.backdrop { background: var(--ds-scrim); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.panel {
  background: var(--ds-surface); border-radius: var(--ds-r-sheet) var(--ds-r-sheet) 0 0; padding-top: 30px;
  box-shadow: 0 -10px 40px rgba(14, 27, 51, 0.18); animation: ds-rise 0.28s cubic-bezier(0.2, 0.9, 0.25, 1);
}
.panel::before { content: ""; position: absolute; top: 8px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--ds-line-2); }
.panel h2 { font-size: 24px; font-weight: 700; }
.panel .sub { color: var(--ds-ink-2); }
.field > span { font-size: 13px; font-weight: 600; color: var(--ds-ink-2); padding-left: 4px; }
.field input[type="date"], .field input[type="time"], .field input[type="text"], .field input[type="url"], .field input[type="number"], .field input:not([type]), .field select {
  border: 1.5px solid transparent; border-radius: var(--ds-r-field); background: var(--ds-surface-2); min-height: 50px;
}
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--ds-tint); box-shadow: 0 0 0 4px var(--ds-tint-soft); }
.price-wrap b { color: var(--ds-ink-3); }

/* Control segmentado en cápsula */
.seg { background: var(--ds-fill); border-radius: var(--ds-r-pill); padding: 4px; gap: 4px; }
.seg button { border-radius: var(--ds-r-pill); min-height: 40px; color: var(--ds-ink-2); }
.seg button[aria-pressed="true"] { background: var(--ds-surface); color: var(--ds-ink); box-shadow: 0 2px 8px rgba(14, 27, 51, 0.12), 0 0 0 0.5px rgba(14, 27, 51, 0.04); }

/* Avisos y notas */
.err { border-radius: var(--ds-r-field); background: var(--ds-neg-soft); color: var(--ds-neg); }
.note { border-radius: var(--ds-r-field); background: var(--ds-tint-soft); color: var(--ds-ink); }
.found li, .mails li { border-radius: 14px; background: var(--ds-surface-2); }
.guide li::before { background: var(--ds-tint-soft); color: var(--ds-tint); }
.peek summary, .how summary { color: var(--ds-tint); }
.how summary { color: var(--ds-ink); }
.raw { background: var(--ds-surface-2); border-radius: 12px; }
.mono { background: var(--ds-fill); font-family: var(--ds-font-mono); }

/* Aviso flotante de vidrio */
.toast {
  border-radius: var(--ds-r-pill); background: rgba(14, 27, 51, 0.86); color: #fff; padding: 8px 20px;
  -webkit-backdrop-filter: var(--ds-glass-blur); backdrop-filter: var(--ds-glass-blur);
  box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.25), 0 10px 30px rgba(14, 27, 51, 0.3);
}
/* Tarjetas secundarias (Master: por tarjeta, cuotas; plegables) */
.tile, .cq { border: 0; border-radius: 20px; background: var(--ds-surface); box-shadow: var(--ds-shadow-1); }
.fold { border: 0; border-radius: var(--ds-r-card); background: var(--ds-surface); box-shadow: var(--ds-shadow-1); }
.stepper button, .step-val { border: 0; background: var(--ds-surface-2); border-radius: var(--ds-r-field); }
.period { border-top: 0.5px solid var(--ds-line-2); }
.linkrow { border: 0; border-radius: var(--ds-r-card); background: var(--ds-surface); box-shadow: var(--ds-shadow-1); min-height: 64px; padding: 12px 14px 12px 12px; }
.linkrow:active { background: var(--ds-surface-2); }
.linkrow > svg { color: var(--ds-ink-3); }
.mark.sm { width: 40px; height: 40px; border-radius: 11px; }
.num { background: var(--ds-tint-soft); color: var(--ds-tint); }
.mark.app-icon { display: block; padding: 0; background: none; object-fit: cover; border-radius: 23%; box-shadow: 0 0 0 0.5px rgba(14, 27, 51, 0.08), 0 4px 12px rgba(41, 80, 244, 0.25); }
.panel .btn.ghost { background: var(--ds-fill); box-shadow: none; }
/*DS:COMP:END*/
/*DS:APP:START*/

/* ── Pagos del mes ── */
*, *::before, *::after { box-sizing: border-box; }
html.lock { overflow: hidden; }
[hidden] { display: none !important; }
body { margin: 0; padding-inline: 16px; letter-spacing: -0.012em; -webkit-text-size-adjust: 100%; }
.app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
svg { display: block; flex: none; }
h1, h2 { margin: 0; text-wrap: balance; }
.muted { margin: 0; font-size: 15px; }
:focus-visible { outline: 3px solid var(--ds-tint); outline-offset: 2px; }

/* Encabezado: icono + línea superior + título grande del mes */
.top { display: flex; align-items: center; }
.top .app-icon { width: 46px; height: 46px; flex: none; }
.top-txt { min-width: 0; }
.top h1 { font-size: clamp(27px, 8.6vw, 34px); }
.title-btn { display: inline; margin: 0; padding: 0; border: 0; background: none; text-align: left; font: inherit; letter-spacing: inherit; color: inherit; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.title-btn svg { display: inline-block; width: 0.56em; height: 0.56em; margin-left: 8px; vertical-align: 0.04em; color: var(--ds-ink-3); }
.title-btn:active { opacity: 0.6; }

/* Botones en cápsula */
.btn { padding: 0 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.block { width: 100%; }

/* Tarjeta principal: avance del mes */

<script>
/*PANEL:START*/
/* Panel Casa: publica en el buzón privado de GitHub un resumen de esta app, para que Panel Casa lo muestre.
   Es el mismo código en Pagos del mes, Balón de gas, Mi cápsula diaria y Mesadas. No se edita en la app:
   se copia desde casa/herramientas/panel-casa.js con  python3 herramientas/conectar-apps.py <carpeta de las apps>
   Uso: PanelCasa.init({ app, title, mount, summary }) al abrir la app y PanelCasa.changed() cada vez que se guarda. */
var PanelCasa = (function () {
  'use strict';
  var KEY = 'panel-casa', REPO_RE = /^[\w.-]+\/[\w.-]+$/;
  var opts = null, cfg = read(), timer = 0, busy = false, again = false, armed = false, editing = false;

  function read() {
    try {
      var c = JSON.parse(localStorage.getItem(KEY) || 'null');
      return c && REPO_RE.test(String(c.r || '')) && typeof c.t === 'string' && c.t.length >= 20 ? c : null;
    } catch (e) { return null; }
  }
  function write() { try { if (cfg) localStorage.setItem(KEY, JSON.stringify(cfg)); else localStorage.removeItem(KEY); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function when(ms) {
    var d = new Date(ms), n = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
    var y = new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1);
    var day = d.toDateString() === n.toDateString() ? 'hoy' : d.toDateString() === y.toDateString() ? 'ayer'
      : d.getDate() + ' ' + ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'][d.getMonth()];
    return day + ', ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ---------- Publicar ---------- */
  async function gh(method, path, body, keep, conn) {
    var c = conn || cfg;
    var r = await fetch('https://api.github.com/repos/' + c.r + path, {
      method: method, cache: 'no-store', keepalive: !!keep,
      headers: { Authorization: 'Bearer ' + c.t, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!r.ok) { var e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
    return r.status === 204 ? null : r.json();
  }
  // El resumen va en la descripción de un hito cerrado con el nombre de la app (por ejemplo «Gas · panel»)
  async function send(desc, retried) {
    if (!cfg.m) {
      var list = await gh('GET', '/milestones?state=all&per_page=100');
      var f = (Array.isArray(list) ? list : []).filter(function (x) { return x && x.title === opts.title; })[0];
      if (!f) { cfg.m = (await gh('POST', '/milestones', { title: opts.title, state: 'closed', description: desc })).number; return; }
      cfg.m = f.number;
    }
    try { await gh('PATCH', '/milestones/' + cfg.m, { description: desc }, true); }
    catch (e) { if (e.status === 404 && !retried) { cfg.m = 0; return send(desc, true); } throw e; }
  }
  async function flush() {
    clearTimeout(timer); timer = 0;
    if (!cfg || !opts) return;
    if (busy) { again = true; return; }
    var data;
    try { data = opts.summary(); } catch (e) { data = null; }
    if (!data) return;
    var body = JSON.stringify(data);
    if (body === cfg.h && !cfg.err) return;          // nada cambió desde la última vez
    busy = true;
    var full = { app: opts.app, v: 1, at: Date.now() };
    Object.keys(data).forEach(function (k) { full[k] = data[k]; });
    try { await send(JSON.stringify(full)); cfg.h = body; cfg.ok = full.at; cfg.err = 0; }
    catch (e) { cfg.err = (e && e.status) || 1; }
    if (cfg) write();
    busy = false; paint();
    if (again) { again = false; flush(); }
  }
  function changed() { if (cfg && opts) { clearTimeout(timer); timer = setTimeout(flush, 1200); } }

  /* ---------- Vista: tarjeta «Panel Casa» al final de la app ---------- */
  var I_HOUSE = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3.5 11.2L12 4l8.5 7.2V20a1 1 0 0 1-1 1h-5v-5.5h-5V21h-5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  function status() {
    if (!cfg) return '';
    if (busy) return '<span class="pc-st">Publicando…</span>';
    if (cfg.err === 401) return '<span class="pc-st pc-bad">El token venció: pega un código nuevo</span>';
    if (cfg.err === 403) return '<span class="pc-st pc-bad">El token no puede escribir en el buzón</span>';
    if (cfg.err === 404) return '<span class="pc-st pc-bad">No se encontró el buzón</span>';
    if (cfg.err) return '<span class="pc-st pc-bad">Sin conexión: se publicará al próximo cambio</span>';
    return '<span class="pc-st pc-ok">' + (cfg.ok ? 'Publicó ' + esc(when(cfg.ok)) : 'Conectada') + '</span>';
  }
  function paint() {
    var el = opts && opts.mount;
    if (!el) return;
    var h = '<section class="pc" aria-label="Panel Casa"><div class="pc-head"><span class="pc-ic">' + I_HOUSE + '</span><div><b>Panel Casa</b>' +
      (cfg ? status() : '<span class="pc-st">Sin conectar</span>') + '</div></div>';
    if (cfg && !editing) {
      h += '<p class="pc-p">Lo que anotas aquí se ve también en Panel Casa.</p><div class="pc-btns">' +
        '<button type="button" class="pc-btn" data-pc="now">Publicar ahora</button>' +
        '<button type="button" class="pc-btn pc-danger' + (armed ? ' pc-armed' : '') + '" data-pc="off">' + (armed ? 'Toca de nuevo' : 'Desconectar') + '</button></div>';
    } else {
      h += '<p class="pc-p">Para ver esta app en Panel Casa: en el panel, abre Conexiones y toca «Copiar código para las apps». Luego vuelve aquí.</p>';
      if (editing) {
        h += '<textarea class="pc-ta" id="pc-ta" rows="3" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Pega aquí el código (empieza con CASA1.)"></textarea>' +
          '<div class="pc-btns"><button type="button" class="pc-btn pc-main" data-pc="save">Conectar</button><button type="button" class="pc-btn" data-pc="cancel">Cancelar</button></div>';
      } else {
        h += '<div class="pc-btns"><button type="button" class="pc-btn pc-main" data-pc="paste">Pegar código</button></div>';
      }
      h += '<p class="pc-err" id="pc-err" hidden></p>';
    }
    el.innerHTML = h + '</section>';
  }
  function parseCode(text) {
    var m = /CASA1\.([A-Za-z0-9+\/=]+)/.exec(String(text || ''));
    if (!m) return null;
    try {
      var o = JSON.parse(atob(m[1]));
      return o && REPO_RE.test(String(o.r || '')) && typeof o.t === 'string' && o.t.trim().length >= 20 ? { r: String(o.r), t: o.t.trim() } : null;
    } catch (e) { return null; }
  }
  function connect(text) {
    var c = parseCode(text);
    if (!c) return false;
    cfg = { r: c.r, t: c.t, m: 0, h: '', ok: 0, err: 0 };
    editing = false; write(); paint(); flush();
    return true;
  }
  function showErr(msg) { var e = document.getElementById('pc-err'); if (e) { e.textContent = msg; e.hidden = false; } }
  function onClick(ev) {
    var b = ev.target.closest && ev.target.closest('[data-pc]');
    if (!b || !opts || !opts.mount.contains(b)) return;
    var a = b.getAttribute('data-pc');
    if (a === 'paste') {
      // Primero intenta leer el portapapeles; si el iPhone no lo permite, muestra un campo para pegar
      var manual = function () { editing = true; paint(); var t = document.getElementById('pc-ta'); if (t) t.focus(); };
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (txt) { if (!connect(txt)) manual(); }, manual);
      } else manual();
    } else if (a === 'save') {
      var t = document.getElementById('pc-ta');
      if (!connect(t ? t.value : '')) showErr('Ese no es el código del panel. Cópialo de nuevo en Panel Casa → Conexiones.');
    } else if (a === 'cancel') { editing = false; paint(); }
    else if (a === 'now') { if (cfg) { cfg.h = ''; flush(); paint(); } }
    else if (a === 'off') {
      if (!armed) { armed = true; paint(); setTimeout(function () { armed = false; paint(); }, 4000); return; }
      armed = false;
      var old = cfg; cfg = null; write(); paint();
      // El hito queda vacío para que el panel no siga mostrando datos viejos
      if (old && old.m) gh('PATCH', '/milestones/' + old.m, { description: '' }, null, false, old).catch(function () {});
    }
  }

  function init(o) {
    opts = o;
    if (!opts || typeof opts.summary !== 'function') return;
    if (opts.mount) { paint(); opts.mount.addEventListener('click', onClick); }
    if (cfg) setTimeout(flush, 1500);
    // Al salir de la app se publica lo que esté pendiente
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && timer) flush(); });
  }
  return { init: init, changed: changed };
})();
/*PANEL:END*/
</script>
<script>
(function () {
  'use strict';

  var LS_KEY = 'pagos-del-mes';
  var MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var MES_RE = /(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)/i;
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  var MAX_HIST = 24;

  var I = {
    check: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20h4.2L19.4 8.8a2.6 2.6 0 0 0-3.7-3.7L4.5 16.3 4 20z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M14.2 6.6l3.7 3.7" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>',
    plus: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>',
    minus: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>',
    up: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    down: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    chev: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    renew: '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4.2h-4.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    clip: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="4.5" width="14" height="16.5" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M9 4.5V3.8A1.3 1.3 0 0 1 10.3 2.5h3.4A1.3 1.3 0 0 1 15 3.8v.7M9 11h6M9 15h4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    art: '<svg class="hero-art" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M7.2 12.4l3.2 3.2 6.4-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  var $ = function (id) { return document.getElementById(id); };
  var titleBtn = $('title-btn'), heroEl = $('hero'), toolbarEl = $('toolbar'), listsEl = $('lists'), historyEl = $('history');
  var sheetEl = $('sheet'), toastEl = $('toast'), backupEl = $('backup'), bText = $('b-text'), bRestore = $('b-restore');

  var state = null;
  var editing = false;
  var filter = 'all';
  var recent = {};
  var sheet = null;
  var undoSnap = null;
  var restoreArmed = false;
  var hideTimer = null;

  /* ---------- Utilidades ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayKey() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtDay(k) { var p = String(k).split('-'); return (+p[2]) + ' ' + MES[+p[1] - 1]; }
  function monthTitle(d) { return MESES[d.getMonth()] + ' ' + d.getFullYear(); }
  function plural(n, s, p) { return n === 1 ? s : p; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function clean(s, max) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, max); }
  function fold(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

  function monthIndex(word) {
    var w = fold(word);
    if (w === 'setiembre') return 8;
    for (var i = 0; i < 12; i++) if (fold(MESES[i]) === w) return i;
    return -1;
  }
  // Propone el título siguiente: "Octubre 2026" → "Noviembre 2026"; "Diciembre 2026" → "Enero 2027".
  function nextTitle(t) {
    var m = String(t).match(MES_RE);
    if (!m) { var d = new Date(); return monthTitle(new Date(d.getFullYear(), d.getMonth() + 1, 1)); }
    var i = monthIndex(m[1]), ni = (i + 1) % 12, name = MESES[ni];
    if (m[1] === m[1].toLowerCase()) name = name.toLowerCase();
    else if (m[1] === m[1].toUpperCase()) name = name.toUpperCase();
    var out = t.slice(0, m.index) + name + t.slice(m.index + m[1].length);
    if (ni === 0) out = out.replace(/\b(\d{4})\b/, function (y) { return String(+y + 1); });
    return out;
  }
  function titleSuggestions(exclude) {
    var d = new Date(), list = [];
    [monthTitle(d), monthTitle(new Date(d.getFullYear(), d.getMonth() + 1, 1)), nextTitle(state.title)].forEach(function (s) {
      if (list.indexOf(s) < 0 && fold(s) !== fold(exclude || '')) list.push(s);
    });
    return list;
  }

  /* ---------- Datos ---------- */
  function blank() {
    return {
      v: 1, title: monthTitle(new Date()), history: [],
      sections: [{ id: uid(), name: 'A inicios de mes', items: [] }, { id: uid(), name: 'A mitad de mes', items: [] }]
    };
  }
  function normState(s) {
    if (!s || typeof s !== 'object' || !Array.isArray(s.sections)) return null;
    var seen = {};
    function sid(v) { var id = String(v || '').replace(/[^\w-]/g, '').slice(0, 40); if (!id || seen[id]) id = uid(); seen[id] = 1; return id; }
    var out = { v: 1, title: clean(s.title, 40) || monthTitle(new Date()), sections: [], history: [] };
    s.sections.forEach(function (sec) {
      if (!sec || typeof sec !== 'object') return;
      var items = [];
      (Array.isArray(sec.items) ? sec.items : []).forEach(function (r) {
        var text = clean(r && r.text, 80);
        if (!text) return;
        var it = { id: sid(r.id), text: text, done: !!r.done };
        if (it.done && DATE_RE.test(String(r.at))) it.at = String(r.at);
        if (r.once) it.once = true;
        items.push(it);
      });
      out.sections.push({ id: sid(sec.id), name: clean(sec.name, 40) || 'Pagos', items: items });
    });
    (Array.isArray(s.history) ? s.history : []).slice(0, MAX_HIST).forEach(function (h) {
      if (!h || !Array.isArray(h.items)) return;
      var items = [];
      h.items.forEach(function (x) { var t = clean(x && x.t, 80); if (t) items.push({ t: t, d: !!x.d, s: clean(x.s, 40) }); });
      if (items.length) out.history.push({ title: clean(h.title, 40) || 'Mes anterior', closed: DATE_RE.test(String(h.closed)) ? String(h.closed) : '', items: items });
    });
    return out;
  }
  function load() {
    var s = null;
    try { var raw = localStorage.getItem(LS_KEY); if (raw) s = normState(JSON.parse(raw)); } catch (e) {}
    state = s || blank();
  }
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); if (window.PanelCasa) PanelCasa.changed(); return true; }
    catch (e) { toast('No se pudo guardar en este dispositivo.'); return false; }
  }
  function snapshot() { undoSnap = JSON.stringify(state); }
  // Cualquier otro cambio deja sin efecto el «Deshacer» que esté a la vista.
  function dropUndo() { if (undoSnap) { undoSnap = null; clearTimeout(toast.t); toastEl.hidden = true; } }
  function undo() {
    if (!undoSnap) return;
    var s = normState(JSON.parse(undoSnap));
    undoSnap = null;
    if (!s) return;
    state = s; save(); render(); toast('Se deshizo el cambio.');
  }

  function findSec(id) { for (var i = 0; i < state.sections.length; i++) if (state.sections[i].id === id) return state.sections[i]; return null; }
  function locate(id) {
    for (var i = 0; i < state.sections.length; i++) {
      var sec = state.sections[i];
      for (var j = 0; j < sec.items.length; j++) if (sec.items[j].id === id) return { sec: sec, idx: j, it: sec.items[j] };
    }
    return null;
  }
  function counts() {
    var c = { total: 0, done: 0, once: 0 };
    state.sections.forEach(function (sec) { sec.items.forEach(function (it) { c.total++; if (it.done) c.done++; if (it.once) c.once++; }); });
    return c;
  }

  /* ---------- Vistas ---------- */
  function render() {
    // Conserva lo que se esté escribiendo en las filas de "Agregar pago".
    var drafts = {};
    Array.prototype.forEach.call(listsEl.querySelectorAll('.addrow'), function (f) { if (f.elements.t.value) drafts[f.dataset.sec] = f.elements.t.value; });

    titleBtn.innerHTML = esc(state.title) + I.pencil;
    renderHero();
    renderToolbar();
    renderLists();
    renderHistory();

    Array.prototype.forEach.call(listsEl.querySelectorAll('.addrow'), function (f) { if (drafts[f.dataset.sec]) f.elements.t.value = drafts[f.dataset.sec]; });
    if (backupEl.open) fillBackup();
  }

  function renderHero() {
    var c = counts(), left = c.total - c.done;
    var pct = c.total ? Math.round(c.done * 100 / c.total) : 0;
    var all = c.total > 0 && left === 0;
    var note = !c.total ? 'Agrega los pagos del mes para empezar.'
      : all ? I.check + '¡Todo pagado este mes!'
      : 'Faltan ' + left + ' ' + plural(left, 'pago', 'pagos') + '.';
    heroEl.innerHTML = I.art +
      '<div class="hero-top"><span class="eyebrow">Pagados</span>' +
      '<button type="button" class="hero-btn' + (all ? ' cta' : '') + '" data-act="newmonth">' + I.renew + 'Nuevo mes</button></div>' +
      '<div class="count-big" aria-label="' + c.done + ' de ' + c.total + ' pagados">' + c.done + '<span>de ' + c.total + '</span></div>' +
      '<div class="hbar" role="progressbar" aria-label="Avance del mes" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><span style="width:' + pct + '%"></span></div>' +
      '<p class="hero-note">' + note + '</p>';
  }

  function renderToolbar() {
    var c = counts(), left = c.total - c.done, h = '';
    if (editing) h += '<span class="editing-label">Editando la lista</span>';
    else h += '<div class="seg" role="group" aria-label="Mostrar">' +
      '<button type="button" data-act="filter" data-v="all" aria-pressed="' + (filter === 'all') + '">Todos</button>' +
      '<button type="button" data-act="filter" data-v="pending" aria-pressed="' + (filter === 'pending') + '">Pendientes' + (left ? '<span class="n">' + left + '</span>' : '') + '</button></div>';
    h += '<button type="button" class="btn small ' + (editing ? 'primary' : 'ghost') + '" data-act="edit">' + (editing ? 'Listo' : 'Editar') + '</button>';
    toolbarEl.innerHTML = h;
  }

  function itemRow(it) {
    var meta = '';
    if (it.done) meta += '<span class="paid">Pagado' + (it.at ? ' el ' + fmtDay(it.at) : '') + '</span>';
    if (it.once) meta += '<i class="tag">Solo este mes</i>';
    return '<li><button type="button" class="item' + (it.done ? ' done' : '') + (recent[it.id] === 2 ? ' just' : '') + '" data-act="toggle" data-id="' + it.id + '" role="checkbox" aria-checked="' + it.done + '">' +
      '<span class="chk">' + I.check + '</span><span class="txt"><b>' + esc(it.text) + '</b>' + (meta ? '<small>' + meta + '</small>' : '') + '</span></button></li>';
  }
  function editRow(it, idx, n) {
    return '<li class="erow">' +
      '<button type="button" class="del" data-act="del" data-id="' + it.id + '" aria-label="Quitar ' + esc(it.text) + '"><i>' + I.minus + '</i></button>' +
      '<button type="button" class="etxt" data-act="itemedit" data-id="' + it.id + '"><span>' + esc(it.text) + '</span>' + (it.once ? '<i class="tag">Solo este mes</i>' : '') + I.chev + '</button>' +
      '<button type="button" class="mv" data-act="mv" data-dir="-1" data-id="' + it.id + '" aria-label="Subir ' + esc(it.text) + '"' + (idx === 0 ? ' disabled' : '') + '>' + I.up + '</button>' +
      '<button type="button" class="mv" data-act="mv" data-dir="1" data-id="' + it.id + '" aria-label="Bajar ' + esc(it.text) + '"' + (idx === n - 1 ? ' disabled' : '') + '>' + I.down + '</button></li>';
  }
  function addRow(sec) {
    return '<li><form class="addrow" data-sec="' + sec.id + '" novalidate>' +
      '<span class="plus" aria-hidden="true">' + I.plus + '</span>' +
      '<input type="text" name="t" maxlength="80" placeholder="Agregar pago" aria-label="Agregar pago en ' + esc(sec.name) + '" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">' +
      '<button type="submit" class="addgo" aria-label="Agregar">' + I.up + '</button></form></li>';
  }

  function renderLists() {
    var c = counts(), h = '';
    if (!c.total && !editing) {
      h += '<div class="card"><h2>La lista está vacía</h2>' +
        '<p class="muted">Copia tu lista en Notas y pégala aquí, o agrega los pagos uno a uno en cada sección.</p>' +
        '<button type="button" class="btn primary" data-act="paste">' + I.clip + 'Pegar lista de Notas</button></div>';
    }
    state.sections.forEach(function (sec) {
      var n = sec.items.length, done = 0, shown = 0, rows = '';
      sec.items.forEach(function (it, idx) {
        if (it.done) done++;
        if (editing) { rows += editRow(it, idx, n); shown++; return; }
        if (filter === 'pending' && it.done && !recent[it.id]) return;
        rows += itemRow(it); shown++;
      });
      if (!editing && filter === 'pending' && n && !shown) rows += '<li class="allok">' + I.check + 'Todo pagado en esta sección</li>';
      h += '<section class="sec" aria-labelledby="sh-' + sec.id + '"><div class="sec-head">' +
        (editing
          ? '<h2 id="sh-' + sec.id + '"><button type="button" class="sec-name" data-act="secedit" data-sec="' + sec.id + '">' + esc(sec.name) + I.pencil + '</button></h2><span class="sec-count">' + n + ' ' + plural(n, 'pago', 'pagos') + '</span>'
          : '<h2 id="sh-' + sec.id + '">' + esc(sec.name) + '</h2>' + (n ? '<span class="sec-count' + (done === n ? ' ok' : '') + '">' + done + ' de ' + n + '</span>' : '')) +
        '</div><ul class="list">' + rows + addRow(sec) + '</ul></section>';
    });
    if (editing || !state.sections.length) {
      h += '<div class="edit-tools"><button type="button" class="btn ghost" data-act="secnew">' + I.plus + 'Agregar sección</button>' +
        '<button type="button" class="btn ghost" data-act="paste">' + I.clip + 'Pegar lista</button></div>';
    }
    listsEl.innerHTML = h;
  }

  function renderHistory() {
    if (!state.history.length) { historyEl.innerHTML = ''; return; }
    var h = '<section class="sec" aria-labelledby="hist-title"><div class="sec-head"><h2 id="hist-title">Meses anteriores</h2></div><ul class="list past">';
    state.history.forEach(function (m) {
      var t = m.items.length, d = 0, body = '', lastSec = null, multi = false;
      m.items.forEach(function (x) { if (x.d) d++; if (lastSec !== null && x.s !== lastSec) multi = true; lastSec = x.s; });
      lastSec = null;
      m.items.forEach(function (x) {
        if (multi && x.s !== lastSec) { body += '<li class="sname">' + esc(x.s || 'Sin sección') + '</li>'; lastSec = x.s; }
        body += '<li class="' + (x.d ? 'd' : '') + '"><span class="mini">' + (x.d ? I.check : '') + '</span>' + esc(x.t) + '</li>';
      });
      var sum = d === t ? '<small class="ok">Todo pagado</small>' : '<small>' + d + ' de ' + t + ' pagados · ' + (t - d) + ' sin marcar</small>';
      h += '<li><details><summary><span class="p-t"><b>' + esc(m.title) + '</b>' + sum + '</span>' + I.chev + '</summary><ul class="p-items">' + body + '</ul></details></li>';
    });
    historyEl.innerHTML = h + '</ul></section>';
  }

  /* ---------- Acciones de la lista ---------- */
  function toggle(id) {
    var loc = locate(id);
    if (!loc) return;
    dropUndo();
    var it = loc.it;
    it.done = !it.done;
    if (it.done) { it.at = todayKey(); recent[id] = 2; } else { delete it.at; delete recent[id]; }
    save(); render();
    if (recent[id]) recent[id] = 1;
    if (filter === 'pending' && it.done) {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () { recent = {}; render(); }, 1100);
    }
  }
  function addItem(form) {
    var input = form.elements.t, text = clean(input.value, 80), sec = findSec(form.dataset.sec);
    if (!text || !sec) return;
    dropUndo();
    sec.items.push({ id: uid(), text: text, done: false });
    input.value = '';
    save(); render();
    var again = listsEl.querySelector('.addrow[data-sec="' + sec.id + '"] input');
    if (again) again.focus();
  }
  function delItem(id) {
    var loc = locate(id);
    if (!loc) return;
    snapshot();
    loc.sec.items.splice(loc.idx, 1);
    save(); render();
    toast('Se quitó «' + loc.it.text + '».', true);
  }
  function moveItem(id, dir) {
    var loc = locate(id);
    if (!loc) return;
    var to = loc.idx + dir, list = loc.sec.items;
    if (to < 0 || to >= list.length) return;
    dropUndo();
    list.splice(loc.idx, 1); list.splice(to, 0, loc.it);
    save(); render();
    var btn = listsEl.querySelector('.mv[data-id="' + id + '"][data-dir="' + dir + '"]');
    if (btn && !btn.disabled) btn.focus();
  }

  /* ---------- Hojas ---------- */
  function openSheet(info, html, focusSel) {
    clearTimeout(toast.t); toastEl.hidden = true;
    sheet = info;
    sheetEl.innerHTML = '<div class="backdrop" data-act="close"></div><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">' + html + '</div>';
    sheetEl.hidden = false;
    document.documentElement.classList.add('lock');
    var f = focusSel && sheetEl.querySelector(focusSel);
    if (f) f.focus(); else sheetEl.querySelector('.panel').focus();
  }
  function closeSheet() {
    sheet = null;
    sheetEl.hidden = true;
    sheetEl.innerHTML = '';
    document.documentElement.classList.remove('lock');
  }
  function sheetErr(id, msg) { var e = $(id); if (e) { e.textContent = msg; e.hidden = false; } }
  function chips(list) {
    return list.length ? '<div class="chips" aria-label="Sugerencias">' + list.map(function (s) { return '<button type="button" class="chip" data-act="sug" data-v="' + esc(s) + '">' + esc(s) + '</button>'; }).join('') + '</div>' : '';
  }

  function openTitle() {
    openSheet({ kind: 'title' },
      '<h2 id="sheet-title">Título del mes</h2>' +
      '<label class="field"><span>Título</span><input type="text" id="sh-input" maxlength="40" value="' + esc(state.title) + '" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"></label>' +
      chips(titleSuggestions(state.title)) +
      '<p class="err" id="sh-err" role="alert" hidden></p>' +
      '<div class="stack"><button type="button" class="btn primary block" data-act="save">Guardar</button></div>', '#sh-input');
  }
  function openNewMonth() {
    var c = counts(), left = c.total - c.done, next = nextTitle(state.title);
    var notes = '';
    if (left) notes += '<p class="note warn">En «' + esc(state.title) + '» quedan ' + left + ' ' + plural(left, 'pago sin marcar', 'pagos sin marcar') + '.</p>';
    if (c.once) notes += '<p class="note">' + (c.once === 1 ? 'Se quitará 1 pago marcado' : 'Se quitarán ' + c.once + ' pagos marcados') + ' como «Solo este mes».</p>';
    openSheet({ kind: 'month' },
      '<h2 id="sheet-title">Nuevo mes</h2>' +
      '<p class="sub">Todos los pagos quedan sin marcar para empezar de nuevo. «' + esc(state.title) + '» se guarda en Meses anteriores.</p>' + notes +
      '<label class="field"><span>Título del mes nuevo</span><input type="text" id="sh-input" maxlength="40" value="' + esc(next) + '" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"></label>' +
      chips(titleSuggestions(next).filter(function (s) { return fold(s) !== fold(state.title); })) +
      '<p class="err" id="sh-err" role="alert" hidden></p>' +
      '<div class="stack"><button type="button" class="btn primary block" data-act="save">Comenzar mes nuevo</button>' +
      '<button type="button" class="btn tonal block" data-act="close">Cancelar</button></div>');
  }
  function openItem(id) {
    var loc = locate(id);
    if (!loc) return;
    var it = loc.it, secs = '';
    if (state.sections.length > 1) {
      secs = '<fieldset class="field"><legend>Sección</legend><div class="radios">' + state.sections.map(function (s) {
        return '<input type="radio" name="isec" id="isec-' + s.id + '" value="' + s.id + '"' + (s === loc.sec ? ' checked' : '') + '><label for="isec-' + s.id + '">' + esc(s.name) + '</label>';
      }).join('') + '</div></fieldset>';
    }
    openSheet({ kind: 'item', id: id },
      '<h2 id="sheet-title">Editar pago</h2>' +
      '<label class="field"><span>Nombre</span><input type="text" id="sh-input" maxlength="80" value="' + esc(it.text) + '" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"></label>' + secs +
      '<label class="switch-row"><span><b>Solo este mes</b><small>Se quita de la lista al comenzar un mes nuevo.</small></span><input type="checkbox" class="switch" id="sh-once"' + (it.once ? ' checked' : '') + '></label>' +
      '<p class="err" id="sh-err" role="alert" hidden></p>' +
      '<div class="stack"><button type="button" class="btn primary block" data-act="save">Guardar</button>' +
      '<button type="button" class="btn danger block" data-act="remove">Eliminar pago</button></div>');
  }
  function openSection(id) {
    var sec = id ? findSec(id) : null;
    openSheet({ kind: 'sec', id: sec ? sec.id : null, armed: false },
      '<h2 id="sheet-title">' + (sec ? 'Editar sección' : 'Nueva sección') + '</h2>' +
      '<label class="field"><span>Nombre</span><input type="text" id="sh-input" maxlength="40" value="' + (sec ? esc(sec.name) : '') + '" placeholder="Ej. A fin de mes" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"></label>' +
      '<p class="err" id="sh-err" role="alert" hidden></p>' +
      '<div class="stack"><button type="button" class="btn primary block" data-act="save">' + (sec ? 'Guardar' : 'Agregar sección') + '</button>' +
      (sec ? '<button type="button" class="btn danger block" data-act="remove">Eliminar sección</button>' : '') + '</div>', sec ? null : '#sh-input');
  }
  function openPaste() {
    var canRead = !!(navigator.clipboard && navigator.clipboard.readText);
    openSheet({ kind: 'paste' },
      '<h2 id="sheet-title">Pegar lista</h2>' +
      '<p class="sub">Copia la lista en Notas y pégala aquí. Cada línea se agrega como un pago, y una línea que termina en dos puntos (:) es el nombre de una sección.</p>' +
      '<label class="field"><span>Lista</span><textarea id="sh-input" rows="9" autocapitalize="sentences" placeholder="A inicios de mes:&#10;Arriendo&#10;Luz&#10;&#10;A mitad de mes:&#10;Agua"></textarea></label>' +
      (canRead ? '<button type="button" class="btn tonal small" data-act="readclip" style="align-self:flex-start">' + I.clip + 'Pegar lo copiado</button>' : '') +
      '<p class="err" id="sh-err" role="alert" hidden></p>' +
      '<div class="stack"><button type="button" class="btn primary block" data-act="save">Agregar a la lista</button></div>');
  }

  // Convierte texto pegado (de Notas u otra fuente) en secciones con pagos.
  function parseList(text) {
    var groups = [], cur = null;
    String(text).split(/\r?\n/).forEach(function (line) {
      var s = line.replace(/^\s*(?:[-*•◦○●▪☐☑☒✓✔]\s*)?(?:\[[ xX✓]?\]\s*)?/, '').replace(/\s+/g, ' ').trim();
      if (!s) return;
      if (/[:：]$/.test(s)) { cur = { name: clean(s.replace(/[:：]+$/, ''), 40), items: [] }; groups.push(cur); return; }
      if (!cur) { cur = { name: null, items: [] }; groups.push(cur); }
      cur.items.push(clean(s, 80));
    });
    return groups;
  }
  function mergeList(groups) {
    var added = 0;
    groups.forEach(function (g) {
      if (!g.items.length && !g.name) return;
      var sec = null;
      if (g.name) {
        state.sections.forEach(function (s) { if (!sec && fold(s.name) === fold(g.name)) sec = s; });
        if (!sec) { sec = { id: uid(), name: g.name, items: [] }; state.sections.push(sec); }
      } else {
        sec = state.sections[0] || null;
        if (!sec) { sec = { id: uid(), name: 'Pagos', items: [] }; state.sections.push(sec); }
      }
      g.items.forEach(function (t) {
        var dup = sec.items.some(function (it) { return fold(it.text) === fold(t); });
        if (!dup) { sec.items.push({ id: uid(), text: t, done: false }); added++; }
      });
    });
    return added;
  }

  function startMonth(title) {
    snapshot();
    var rec = { title: state.title, closed: todayKey(), items: [] };
    state.sections.forEach(function (sec) {
      sec.items.forEach(function (it) { rec.items.push({ t: it.text, d: !!it.done, s: sec.name }); });
      sec.items = sec.items.filter(function (it) { return !it.once; });
      sec.items.forEach(function (it) { it.done = false; delete it.at; });
    });
    if (rec.items.length) { state.history.unshift(rec); state.history = state.history.slice(0, MAX_HIST); }
    state.title = title;
    filter = 'all'; recent = {};
    save(); render();
    window.scrollTo(0, 0);
    toast('Comenzó ' + title + '.', true);
  }

  function sheetSave() {
    if (!sheet) return;
    var input = $('sh-input');
    if (sheet.kind === 'title') {
      var t = clean(input.value, 40);
      if (!t) return sheetErr('sh-err', 'Escribe un título.');
      dropUndo(); state.title = t; save(); closeSheet(); render();
    } else if (sheet.kind === 'month') {
      var nt = clean(input.value, 40);
      if (!nt) return sheetErr('sh-err', 'Escribe el título del mes nuevo.');
      closeSheet(); startMonth(nt);
    } else if (sheet.kind === 'item') {
      var loc = locate(sheet.id);
      if (!loc) return closeSheet();
      var text = clean(input.value, 80);
      if (!text) return sheetErr('sh-err', 'Escribe el nombre del pago.');
      dropUndo();
      loc.it.text = text;
      if ($('sh-once').checked) loc.it.once = true; else delete loc.it.once;
      var pick = sheetEl.querySelector('input[name="isec"]:checked');
      var target = pick ? findSec(pick.value) : null;
      if (target && target !== loc.sec) { loc.sec.items.splice(loc.idx, 1); target.items.push(loc.it); }
      save(); closeSheet(); render();
    } else if (sheet.kind === 'sec') {
      var name = clean(input.value, 40);
      if (!name) return sheetErr('sh-err', 'Escribe el nombre de la sección.');
      var clash = state.sections.some(function (s) { return s.id !== sheet.id && fold(s.name) === fold(name); });
      if (clash) return sheetErr('sh-err', 'Ya hay una sección con ese nombre.');
      dropUndo();
      if (sheet.id) { var sec = findSec(sheet.id); if (sec) sec.name = name; }
      else state.sections.push({ id: uid(), name: name, items: [] });
      save(); closeSheet(); render();
    } else if (sheet.kind === 'paste') {
      var groups = parseList(input.value);
      var lines = groups.reduce(function (n, g) { return n + g.items.length; }, 0);
      if (!lines && !groups.length) return sheetErr('sh-err', 'No hay líneas para agregar. Pega la lista primero.');
      snapshot();
      var added = mergeList(groups);
      save(); closeSheet(); render();
      if (added) toast('Se ' + plural(added, 'agregó 1 pago', 'agregaron ' + added + ' pagos') + '.', true);
      else toast(lines ? 'Esos pagos ya estaban en la lista.' : 'Se agregaron las secciones.', !lines);
    }
  }
  function sheetRemove(btn) {
    if (!sheet) return;
    if (sheet.kind === 'item') { var id = sheet.id; closeSheet(); delItem(id); return; }
    if (sheet.kind === 'sec') {
      var sec = findSec(sheet.id);
      if (!sec) return closeSheet();
      var n = sec.items.length;
      if (n && !sheet.armed) {
        sheet.armed = true;
        btn.classList.add('armed');
        btn.textContent = 'Toca de nuevo para eliminar ' + (n === 1 ? 'la sección y su pago' : 'la sección y sus ' + n + ' pagos');
        return;
      }
      snapshot();
      state.sections = state.sections.filter(function (s) { return s !== sec; });
      save(); closeSheet(); render();
      toast('Se eliminó la sección «' + sec.name + '».', true);
    }
  }

  /* ---------- Respaldo ---------- */
  function fillBackup() { bText.value = JSON.stringify(state); disarmRestore(); }
  function disarmRestore() { restoreArmed = false; bRestore.classList.remove('armed'); bRestore.textContent = 'Restaurar'; }
  function copyBackup() {
    var txt = JSON.stringify(state);
    bText.value = txt;
    function fallback() { bText.focus(); bText.select(); try { document.execCommand('copy'); toast('Respaldo copiado.'); } catch (e) { toast('Selecciona el texto y cópialo.'); } }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast('Respaldo copiado.'); }, fallback);
    else fallback();
  }
  function restoreBackup() {
    var s = null;
    try { s = normState(JSON.parse(bText.value)); } catch (e) {}
    if (!s) { disarmRestore(); toast('El texto no es un respaldo válido.'); return; }
    if (!restoreArmed) { restoreArmed = true; bRestore.classList.add('armed'); bRestore.textContent = 'Toca de nuevo para restaurar'; return; }
    snapshot();
    state = s; editing = false; filter = 'all';
    save(); render();
    toast('Se restauró el respaldo.', true);
  }

  /* ---------- Avisos ---------- */
  function toast(msg, withUndo) {
    var undoable = withUndo && undoSnap;
    toastEl.innerHTML = '<span>' + esc(msg) + '</span>' + (undoable ? '<button type="button" data-act="undo">Deshacer</button>' : '');
    toastEl.classList.toggle('plain', !undoable);
    toastEl.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { toastEl.hidden = true; if (undoable) undoSnap = null; }, undoable ? 6000 : 2800);
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var a = b.dataset.act, id = b.dataset.id;
    switch (a) {
      case 'toggle': toggle(id); break;
      case 'title': openTitle(); break;
      case 'newmonth': openNewMonth(); break;
      case 'filter': filter = b.dataset.v; recent = {}; render(); break;
      case 'edit': editing = !editing; filter = 'all'; recent = {}; render(); break;
      case 'del': delItem(id); break;
      case 'mv': moveItem(id, +b.dataset.dir); break;
      case 'itemedit': openItem(id); break;
      case 'secedit': openSection(b.dataset.sec); break;
      case 'secnew': openSection(null); break;
      case 'paste': openPaste(); break;
      case 'close': closeSheet(); break;
      case 'save': sheetSave(); break;
      case 'remove': sheetRemove(b); break;
      case 'sug': var inp = $('sh-input'); if (inp) { inp.value = b.dataset.v; var er = $('sh-err'); if (er) er.hidden = true; } break;
      case 'readclip':
        navigator.clipboard.readText().then(function (t) { var ta = $('sh-input'); if (ta && t) ta.value = (ta.value ? ta.value + '\n' : '') + t; }, function () { toast('No se pudo leer lo copiado. Mantén presionado el cuadro y elige Pegar.'); });
        break;
      case 'undo': clearTimeout(toast.t); toastEl.hidden = true; undo(); break;
      case 'bcopy': copyBackup(); break;
      case 'brestore': restoreBackup(); break;
    }
  });
  listsEl.addEventListener('submit', function (e) {
    var f = e.target.closest('.addrow');
    if (!f) return;
    e.preventDefault();
    addItem(f);
  });
  sheetEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type === 'text') { e.preventDefault(); sheetSave(); }
  });
  sheetEl.addEventListener('input', function () { var er = $('sh-err'); if (er) er.hidden = true; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet) closeSheet(); });
  backupEl.addEventListener('toggle', function () { if (backupEl.open) fillBackup(); });
  bText.addEventListener('input', disarmRestore);
  window.addEventListener('storage', function (e) { if (e.key === LS_KEY) { load(); render(); } });

  load();
  render();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
/*PANEL:APP:START*/
  // Panel Casa: título del mes y cada pago con su estado
  if (window.PanelCasa) PanelCasa.init({ app: 'pagos', title: 'Pagos · panel', mount: document.getElementById('panel-casa'), summary: function () {
    return { title: state.title, s: state.sections.map(function (sec) {
      return { n: sec.name, i: sec.items.map(function (it) { var o = { t: it.text, d: it.done ? 1 : 0 }; if (it.done && it.at) o.a = it.at; return o; }) };
    }) };
  } });
/*PANEL:APP:END*/
})();
</script>
<script>
// Sin zoom con los dedos: Safari en iPhone no siempre respeta «user-scalable=no», así que se cortan sus gestos de zoom
(function () {
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
</script>
</body>
